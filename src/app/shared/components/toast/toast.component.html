<div
  class="fixed bottom-4 right-4 z-[9999] flex flex-col gap-2 w-full max-w-sm pointer-events-none px-4 sm:px-0"
  aria-live="polite"
  aria-atomic="true"
>
  @for (toast of toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex items-start gap-3 rounded-lg border px-4 py-3 shadow-lg transition-all duration-300 ease-out"
      [class]="classesPorTipo(toast.type)"
      role="alert"
    >
      <lucide-icon
        [img]="toast.type === 'success' ? lucideCheckCircle : lucideAlertCircle"
        [size]="20"
        class="shrink-0 mt-0.5"
      />

      <p class="flex-1 text-sm font-semibold leading-snug whitespace-pre-line">
        {{ toast.message }}
      </p>

      <button
        type="button"
        (click)="fechar(toast.id)"
        class="shrink-0 rounded-md p-1 opacity-70 hover:opacity-100 transition-opacity focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-1"
        [class.focus-visible:ring-emerald-400]="toast.type === 'success'"
        [class.focus-visible:ring-red-400]="toast.type === 'error'"
        aria-label="Fechar notificação"
      >
        <lucide-icon [img]="lucideX" [size]="16" />
      </button>
    </div>
  }
</div>
